<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Interesse</title>
</head>
<body>
  <h2>Formulário de Interesse nos Cursos</h2>
  <form action="salvar_form.php" method="POST">
    <label>Nome:</label><br>
    <input type="text" name="nome" required><br><br>

    <label>Idade:</label><br>
    <input type="number" name="idade" required><br><br>

    <label>Curso desejado:</label><br>
    <select name="curso" required>
      <option value="Auxiliar Administrativo">Auxiliar Administrativo</option>
      <option value="Atendente de Farmácia">Atendente de Farmácia</option>
      <option value="Auxiliar Contábil">Auxiliar Contábil</option>
      <option value="Desenvolvedor Web">Desenvolvedor Web</option>
      <option value="Designer Gráfico">Designer Gráfico</option>
      <option value="Informática Kids">Informática Kids</option>
      <option value="Informática Básica">Informática Básica</option>
      <option value="Informática Básica e Avançada">Informática Básica e Avançada</option>
      <option value="Informática Básica e Profissionalizante">Informática Básica e Profissionalizante</option>
      <option value="Líder do Administrativo">Líder do Administrativo</option>
      <option value="Mestre em Excel">Mestre em Excel</option>
      <option value="Operador de Caixa">Operador de Caixa</option>
      <option value="Professor do Futuro">Professor do Futuro</option>
      <option value="Social Media Pro">Social Media Pro</option>
      <option value="Vendedor Digital">Vendedor Digital</option>
      <option value="Youtuber">Youtuber</option>
    </select><br><br>

    <label>Whatsapp:</label><br>
    <input type="text" name="whatsapp" placeholder="(XX) XXXXX-XXXX" required><br><br>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
